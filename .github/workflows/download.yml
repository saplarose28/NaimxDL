
name: Direct File Downloader

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: "Direct URL of a file you are allowed to download"
        required: true
        type: string

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Download file
        env:
          FILE_URL: ${{ inputs.file_url }}
        run: python download.py
